<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>pseudo element and pseudo class</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
     <h1>Pseudo class</h1> 
       <!-- anchor tag — hover pseudo-class use hoga -->
     <a href="https://chatgpt.com/?openaicom_referred=true" target="_blank">chat gpt link</a>
     
     
      <!-- input field — focus pseudo-class use hogi -->
     <input type="text">



      <!-- First unordered list -->
     <ul>
      <li>one</li>
      <li>two</li>
      <li>three</li>
      <li>four</li>
     </ul>



      <!-- Second unordered list -->
      <ul>
      <li>one1</li>
      <li>two1</li>
      <li>three1</li>
      <li>four1</li>
     </ul>


   <h2>pseudo element</h2>
   <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Cum, quod!</p>
</body>
</html>
