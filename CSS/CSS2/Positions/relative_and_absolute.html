<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
      <style>
            #outer{
                  position: relative;
                  height: 300px;
                  width: 300px;
                  background-color: lightcoral;
            }
            #inner{
                  position: absolute;
                  height: 100px;
                  width: 100px;
                  background-color: lightgreen;
                  top: 0px;
                  left: 0px;
                  /* bottom: 0px;
                  right: 0px; */
            }
      </style>
</head>
<body>
      <div id="outer">
            outer box
            <div id="inner">
                  inner box
            </div>
      </div>
</body>
</html>
